<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Unjumble Game</title>
<style>
@font-face{font-family:'Hakgyoansim Boardmarker';src:url('Hakgyoansim_BoardmarkerR.ttf') format('truetype');font-display:swap}
@font-face{font-family:'Hakgyoansim Poster';src:url('Hakgyoansim_PosterB.ttf') format('truetype');font-display:swap}
:root{
  --ink:#4a3476; --pink:#ff4f9a; --purple:#a060ef; --blue:#56aee7; --yellow:#ffc83d;
  --cream:#fff7e7; --peach:#ffd8bd; --mint:#c9f4bc; --panel:#fffdf8; --shadow:0 14px 34px rgba(91,54,89,.18);
  --title-font:'Hakgyoansim Poster',sans-serif;
  --body-font:'Hakgyoansim Boardmarker',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(135deg,#ffe7d6,#fff6dc 48%,#f2dcff);color:var(--ink);font-family:var(--body-font);font-size:18px;overflow-x:hidden}
button,input{font:inherit}
button{border:0;cursor:pointer;color:inherit}
body{font-size:18px}
h1,h2,h3,h4,h5,h6{font-family:var(--title-font)}
button:focus-visible{outline:5px solid rgba(76,63,152,.38);outline-offset:3px}
.fa-solid,.fa-regular{display:inline-block;font-family:Arial,sans-serif;font-style:normal;line-height:1}
.fa-house::before{content:'Home';font-size:13px;font-weight:700}.fa-play::before{content:'>'}.fa-circle-question::before{content:'?'}.fa-bell::before{content:'SFX';font-size:12px;font-weight:700}.fa-bell-slash::before{content:'SFX';font-size:12px;text-decoration:line-through;font-weight:700}.fa-music::before{content:'MUSIC';font-size:10px;font-weight:700}.fa-volume-xmark::before{content:'MUSIC';font-size:10px;text-decoration:line-through;font-weight:700}.fa-expand::before{content:'+';font-size:25px}.fa-compress::before{content:'-';font-size:25px}
.screen{display:none;min-height:100vh;animation:screenIn .35s ease}
.screen.active{display:flex;flex-direction:column}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#coverScreen{align-items:center;justify-content:center;background:url('Unjumble Game 표지.png') center/cover no-repeat;gap:clamp(6px,1.4vh,14px);padding:0;--coverNote:86px;min-height:100vh;width:100%;position:relative}
.cover-frame{position:absolute;inset:0;width:100%;height:100%;background:transparent;display:flex;align-items:center;justify-content:center}
.cover-hotspot{position:absolute;z-index:2;background:transparent;border-radius:999px;color:transparent;overflow:hidden;cursor:pointer;border:0;box-shadow:none;outline:none}
.cover-hotspot::before,.cover-hotspot::after{display:none!important;content:none!important}
.cover-hotspot:hover,.cover-hotspot:focus-visible,.cover-hotspot:active{transform:none;filter:none;box-shadow:none;outline:none}
.cover-hotspot.help{left:31%;top:81%;width:18%;height:14%}
.cover-hotspot.start{left:48%;top:81%;width:20%;height:14%}
.cover-corner{position:absolute;top:1.6%;right:1.5%;display:flex;gap:10px}
.cover-corner .round-icon{background:rgba(255,255,255,.78);backdrop-filter:blur(8px)}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-left));background:rgba(255,252,246,.88);backdrop-filter:blur(14px);border-bottom:2px solid rgba(117,84,143,.12)}
.top-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px max(12px,env(safe-area-inset-left));background:rgba(255,252,246,.88);backdrop-filter:blur(14px);border-bottom:2px solid rgba(117,84,143,.12)}
.top-nav .nav-group{display:flex;align-items:center;gap:10px}
.top-nav .brand{font-size:clamp(22px,3vw,34px);margin:0 auto 0 0;text-shadow:0 2px #fff}
.top-nav .nav-btn{display:inline-flex;align-items:center;justify-content:center;min-width:48px;min-height:46px;padding:0 14px;border-radius:18px;background:#fff;box-shadow:0 5px 12px rgba(90,57,109,.13);transition:.2s;border:0;cursor:pointer;color:inherit;font-size:20px}
.top-nav .nav-btn.icon-only{width:48px;padding:0}
.top-nav .nav-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(90,57,109,.2)}
.top-nav .nav-btn[aria-label="게임 방법"]{font-size:18px}
.top-nav .brand-label{display:none}
.brand{font-size:clamp(22px,3vw,34px);margin-right:auto;text-shadow:0 2px #fff}
.round-icon,.pill-btn{min-height:46px;border-radius:18px;background:#fff;box-shadow:0 5px 12px rgba(90,57,109,.13);padding:0 15px;transition:.2s}
.round-icon{width:48px;padding:0;font-size:21px}
.round-icon:hover,.pill-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(90,57,109,.2)}
.utility-label{display:inline}
.glass-pill{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(100,120,180,.15)}

.page{width:min(1180px,calc(100% - 24px));margin:22px auto 40px;display:grid;gap:18px}
.hero-card,.panel{background:rgba(255,253,248,.95);border:3px solid rgba(255,255,255,.95);border-radius:34px;box-shadow:var(--shadow)}
.hero-card{padding:clamp(22px,4vw,42px);display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,242,222,.96))}
.hero-card h1{font-size:clamp(34px,6vw,65px);line-height:1;margin:0 0 12px}
.hero-card p{font-size:clamp(18px,2.4vw,26px);margin:0;line-height:1.45}
.snapshot{background:#fff;border-radius:28px;padding:18px;border:3px dashed #c08cc7;box-shadow:0 10px 20px rgba(80,50,90,.12);text-align:center}
.snapshot-title{font-size:18px;margin-bottom:12px;color:#8a6a9c}
.word-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mini-word,.word-card{color:white;text-shadow:0 2px rgba(56,28,80,.15);box-shadow:0 7px 0 rgba(95,58,111,.14),0 10px 20px rgba(82,51,91,.16)}
.mini-word{padding:16px 17px;border-radius:19px;font-size:clamp(17px,2vw,24px);transform:rotate(var(--rot,0deg))}
.palette-0{background:linear-gradient(145deg,#b170f3,#8d50dc)}
.palette-1{background:linear-gradient(145deg,#ff5aa5,#ee2f82)}
.palette-2{background:linear-gradient(145deg,#68c0f0,#4a9fda)}
.palette-3{background:linear-gradient(145deg,#ffd550,#f6b91f)}
.palette-4{background:linear-gradient(145deg,#72d5be,#38b99c)}
.palette-5{background:linear-gradient(145deg,#ff9a56,#ff6b35)}
.palette-6{background:linear-gradient(145deg,#c471ed,#9d4edd)}
.palette-7{background:linear-gradient(145deg,#3a86ff,#1c5aa0)}
.palette-8{background:linear-gradient(145deg,#fb5607,#c1121f)}

.panel{padding:clamp(18px,3vw,30px)}
.section-title{display:flex;align-items:center;gap:12px;font-size:clamp(25px,3.4vw,38px);margin:0 0 18px}
.step-badge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--yellow);color:#5f4083;box-shadow:0 5px 0 #e5aa2c}
.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.category-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:17px 16px;border-radius:22px;background:#fff;border:3px solid transparent;box-shadow:0 7px 16px rgba(75,45,92,.11);font-size:clamp(18px,2vw,24px);transition:.2s}
.category-btn .emoji{font-size:30px}
.category-btn:hover{transform:translateY(-3px)}
.category-btn.selected{border-color:#a261ed;background:#f7eeff;box-shadow:0 7px 0 #c9a7ec}
.sub-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.counter{margin-left:auto;background:#fff4bd;padding:10px 16px;border-radius:15px;color:#7b5d1d}
.sub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sub-btn{padding:22px 18px;border-radius:20px;background:#fff;border:3px solid #eadff1;box-shadow:0 6px 0 #e1d2e9;font-size:23px;transition:.2s}
.sub-btn .sub-count{font-size:16px;color:#9a86a8;margin-left:4px}
.sub-btn.selected{background:#e7f8de;border-color:#79c967;box-shadow:0 6px 0 #b6dda8}
.sub-btn:hover{transform:translateY(-2px)}
.select-all-btn{display:block;width:100%;margin-bottom:12px;background:#f4ebff;border-color:#d9c3f2;box-shadow:0 6px 0 #c9a7ec;font-weight:700}
.select-all-btn.selected{background:#e7f8de;border-color:#79c967;box-shadow:0 6px 0 #b6dda8}
.sub-title-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sub-badge{background:#f4ebff;border-radius:999px;padding:7px 12px;font-size:18px;color:#6e5390}
.start-bar{display:flex;justify-content:center;margin-top:22px}
.primary-btn,.secondary-btn,.danger-btn{border-radius:22px;padding:16px 26px;font-size:clamp(20px,2.4vw,27px);box-shadow:0 7px 0 rgba(86,55,96,.18);transition:.2s}
.primary-btn{background:linear-gradient(90deg,#ffd86a,#bff1a7);color:#523b75}
.secondary-btn{background:linear-gradient(90deg,#bfe9ff,#ffc7e2)}
.danger-btn{background:#ffe0df;color:#9b3c45}
.primary-btn:hover,.secondary-btn:hover,.danger-btn:hover{transform:translateY(-3px)}
.primary-btn:active,.secondary-btn:active,.danger-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(86,55,96,.18)}
.primary-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.game-page{width:min(1180px,calc(100% - 20px));margin:16px auto 30px;display:grid;gap:14px}
.game-hud{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}
.progress-wrap{height:22px;background:#efe5f2;border-radius:999px;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 2px 5px rgba(74,45,91,.14)}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#5fc1ef,#ad72f3,#ff66a8);transition:width .45s ease;border-radius:999px}
.hud-chip{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 5px 12px rgba(72,43,91,.12);white-space:nowrap;font-size:18px}
.game-board{background:rgba(255,253,248,.96);border-radius:34px;padding:clamp(18px,3.5vw,36px);box-shadow:var(--shadow);border:3px solid #fff;min-height:560px;display:grid;grid-template-rows:auto auto 1fr auto;gap:18px}
.question-top{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;text-align:center}
.prompt{display:grid;gap:8px;justify-items:center}
.topic-line{font-size:clamp(18px,2.2vw,22px);margin:0;color:#8b6f9e;background:#fff2cf;border-radius:999px;padding:8px 16px;box-shadow:0 5px 12px rgba(72,43,91,.08)}
.prompt h2{font-size:clamp(27px,4vw,44px);margin:0 0 6px}
.prompt p{font-size:clamp(17px,2vw,22px);margin:0;color:#755f89}
.answer-label{text-align:center;font-size:19px;color:#7a6490}
.word-board{min-height:150px;border:4px dashed #c6a2d5;border-radius:28px;background:linear-gradient(180deg,#fff,#fff9ed);display:flex;align-content:center;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding:24px;transition:.2s}
.word-board.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.word-card{padding:18px 22px;border-radius:22px;font-size:clamp(22px,3vw,34px);user-select:none;touch-action:none;cursor:grab;position:relative;transition:transform .12s,box-shadow .12s;min-width:75px;text-align:center}
.word-card:hover{transform:translateY(-4px) rotate(-1deg)}
.word-card.dragging{opacity:.25;transform:scale(.95)}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.9;transform:rotate(3deg) scale(1.05);margin:0}
.hint-box,.answer-reveal{display:none;border-radius:20px;padding:14px 18px;text-align:center;font-size:20px}
.hint-box.show{display:block;background:#fff1be;border:3px solid #ffd361}
.answer-reveal.show{display:block;background:#e8f7ff;border:3px solid #8fcce8}
.game-actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.tiny-note{font-size:14px;color:#806b8d;text-align:center;width:100%}
.feedback-toast{min-height:31px;text-align:center;font-size:21px;color:#9a597b}

.modal-backdrop{position:fixed;inset:0;background:rgba(55,35,68,.48);display:none;align-items:center;justify-content:center;padding:18px;z-index:200;backdrop-filter:blur(5px)}
.modal-backdrop.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(700px,100%);max-height:min(88vh,760px);overflow:auto;background:#fffdf7;border-radius:34px;padding:26px;box-shadow:0 25px 80px rgba(39,25,54,.35);border:4px solid #fff;text-align:center;animation:pop .25s ease}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #eadff1;box-shadow:0 4px 0 #e1d2e9;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{transform:translateY(-2px)}
@keyframes pop{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:clamp(29px,4vw,45px);margin:0 0 12px}
.modal p,.modal li{font-size:19px;line-height:1.55}
.how-list{display:grid;gap:12px;text-align:left;margin:18px 0;padding:0;list-style:none}
.how-list li{background:#fff3df;border-radius:18px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start}
.modal-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.correct-answer-card{margin:16px 0;background:#f3eaff;border-radius:22px;padding:18px;font-size:clamp(24px,3.3vw,36px);color:#5d3c87}

.result-wrap{width:min(950px,calc(100% - 22px));margin:24px auto 50px;display:grid;gap:18px}
.result-card{background:#fffdf8;border-radius:38px;padding:clamp(24px,5vw,48px);box-shadow:var(--shadow);border:4px solid #fff;text-align:center;position:relative;overflow:hidden}
.result-card h1{font-size:clamp(40px,7vw,78px);margin:0 0 8px}
.score-big{font-size:clamp(58px,10vw,110px);color:#8b50d8;text-shadow:0 6px #ead9ff;margin:12px 0}
.result-stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.stat{background:#fff0c8;border-radius:20px;padding:14px 20px;font-size:21px}
.review{background:#fffdf8;border-radius:30px;padding:22px;box-shadow:var(--shadow)}
.review h2{margin-top:0}
.review-list{display:grid;gap:12px}
.review-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;text-align:left;background:#fff7ea;border-radius:16px;padding:14px 16px;align-items:start}
.review-item.ok{background:#effbe9}.review-item.no{background:#fff0ef}
.review-main b{display:block;font-size:20px;margin-bottom:5px}
.review-meaning{font-size:17px;color:#6e5a7e;line-height:1.45}
.review-note{font-size:15px;color:#8a7398;margin-top:4px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:22px;border-radius:4px;animation:fall var(--d) linear infinite;animation-delay:var(--delay);background:var(--c);left:var(--x)}
@keyframes fall{to{transform:translateY(900px) rotate(760deg)}}

[data-tip]{position:relative}
[data-tip]:hover::before{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#4e3b68;color:#fff;padding:7px 10px;border-radius:10px;font-size:13px;white-space:nowrap;z-index:99;box-shadow:0 5px 15px rgba(0,0,0,.18)}

@media(max-width:780px){
 #coverScreen{--coverNote:104px}.cover-note{font-size:13px;padding:7px 14px;border-radius:20px}
 .utility-label{display:none}.topbar{gap:7px}.round-icon,.pill-btn{min-height:42px}.round-icon{width:44px}.pill-btn{padding:0 12px}
 .hero-card{grid-template-columns:1fr}.category-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sub-grid{grid-template-columns:1fr}
 .counter{margin-left:0}.question-top{grid-template-columns:1fr}
 .game-hud{grid-template-columns:1fr 1fr}.progress-wrap{grid-column:1/-1}.game-board{min-height:calc(100vh - 180px)}
 .word-board{padding:16px;gap:10px}.word-card{padding:15px 16px;min-width:62px}
}
@media(max-width:480px){
 #coverScreen{--coverNote:112px}.cover-note{font-size:12px;line-height:1.4}
 .category-grid{grid-template-columns:1fr}.category-btn{padding:12px}.page{margin-top:12px}.game-page{margin-top:8px}
 .game-board{padding:14px;border-radius:25px}.word-board{min-height:170px}.game-actions button{flex:1 1 42%;padding:14px 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

.cover-note{flex:0 0 auto;width:min(100%,860px);text-align:center;
 font-size:clamp(12px,1.5vw,18px);line-height:1.35;color:#5b3f7a;background:rgba(255,255,255,.86);
 border-radius:999px;padding:8px 18px;box-shadow:0 6px 16px rgba(90,60,110,.16);
 border:2px solid rgba(255,255,255,.9)}

#subPeek{position:fixed;z-index:300;display:none;width:min(380px,calc(100vw - 24px));max-height:290px;overflow:auto;
 background:#fffdf7;border:3px solid #e8d8f4;border-radius:22px;box-shadow:0 18px 42px rgba(70,40,90,.26);
 padding:14px 16px;text-align:left}
#subPeek.show{display:block}
.peek-head{font-size:18px;color:#6e5390;margin-bottom:9px;padding-bottom:8px;border-bottom:2px dashed #ecdff5}
.peek-list{margin:0;padding-left:20px;display:grid;gap:8px}
.peek-list li{font-size:16px;line-height:1.35;color:#4a3476}
.peek-list li span{display:block;font-size:14px;color:#836e93;margin-top:2px}
.peek-more{margin-top:8px;font-size:14px;color:#8a7398;text-align:center}

.nav-btn-group{position:fixed;display:flex;align-items:center;gap:8px;z-index:60}
#top-nav-bar .nav-btn-group:first-child{top:18px;left:18px}
#top-nav-bar .nav-btn-group:last-child{top:18px;right:18px}
.nav-btn-circle{width:52px;height:52px;border-radius:9999px;border:2px solid rgba(255,255,255,0.85);background:rgba(255,255,255,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;color:#4a3476;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.nav-btn-circle:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.15)}

#categoryScreen .nav-btn-group,#subScreen .nav-btn-group,#gameScreen .nav-btn-group,#resultScreen .nav-btn-group{position:fixed;display:flex;align-items:center;gap:8px;z-index:60}
#top-nav-bar-2 .nav-btn-group:first-child,#top-nav-bar-3 .nav-btn-group:first-child,#top-nav-bar-4 .nav-btn-group:first-child,#top-nav-bar-5 .nav-btn-group:first-child{top:18px;left:18px}
#top-nav-bar-2 .nav-btn-group:last-child,#top-nav-bar-3 .nav-btn-group:last-child,#top-nav-bar-4 .nav-btn-group:last-child,#top-nav-bar-5 .nav-btn-group:last-child{top:18px;right:18px}
</style>
</head>
<body>
<div id="app">
  <section id="coverScreen" class="screen active" aria-label="게임 표지">
    <div class="cover-frame">
      <div id="top-nav-bar" aria-label="게임 네비게이션">
        <div class="nav-btn-group">
          <button type="button" id="nav-home-btn" class="nav-btn-circle" title="처음으로" aria-label="처음으로" onclick="navHome()"><i class="fa-solid fa-house"></i></button>
          <button type="button" id="nav-back-btn" class="nav-btn-circle" title="뒤로" aria-label="뒤로" onclick="navBack()"><i class="fa-solid fa-play" style="transform:scaleX(-1)"></i></button>
          <button type="button" id="nav-forward-btn" class="nav-btn-circle" title="앞으로" aria-label="앞으로" onclick="navForward()"><i class="fa-solid fa-play"></i></button>
        </div>
        <div class="nav-btn-group">
          <button type="button" id="nav-htp-btn" class="nav-btn-circle" title="How to Play" aria-label="게임 방법" onclick="openHelp()"><i class="fa-regular fa-circle-question"></i></button>
          <button type="button" id="sfx-toggle-btn" class="nav-btn-circle" title="효과음 On/Off" aria-label="효과음 켜기/끄기" onclick="toggleSfx()"><i id="sfx-toggle-icon" class="fa-solid fa-bell"></i></button>
          <button type="button" id="music-toggle-btn" class="nav-btn-circle" title="배경음악 On/Off" aria-label="배경음악 켜기/끄기" onclick="toggleBgm()"><i id="music-toggle-icon" class="fa-solid fa-music"></i></button>
          <button type="button" id="fullscreen-toggle-btn" class="nav-btn-circle" title="전체화면" aria-label="전체 화면" onclick="toggleFullscreen()"><i id="fullscreen-toggle-icon" class="fa-solid fa-expand"></i></button>
        </div>
      </div>

  ]}
];

const state={categoryId:DATA[0].id,categoryChosen:false,selectedSubs:new Set(),questions:[],round:0,score:0,correctCount:0,attempts:0,hintUsed:false,answered:false,review:[],voiceOn:true,sfxOn:true};
const navHistory=[],navFuture=[];
let dragState=null;
let modalMode=null;
const BGM={on:true,el:null};

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function currentCategory(){return DATA.find(c=>c.id===state.categoryId)}
function currentQuestion(){return state.questions[state.round]}
function currentScreenId(){return document.querySelector('.screen.active')?.id||'coverScreen'}

function showScreen(id,recordHistory=true){
 closeModal();hideSubPeek();
 const activeCurrent=currentScreenId();
 if(recordHistory&&activeCurrent&&activeCurrent!==id){navHistory.push(activeCurrent);navFuture.length=0;}
 $$('.screen').forEach(s=>s.classList.remove('active'));
 $('#'+id).classList.add('active');
 window.scrollTo({top:0,behavior:'smooth'});
 updateNavButtons();
}

function navHome(){const active=currentScreenId();if(active==='coverScreen')return;navHistory.push(active);navFuture.length=0;showScreen('coverScreen',false);}
function navBack(){const active=currentScreenId();if(navHistory.length===0)return;const prev=navHistory.pop();navFuture.push(active);showScreen(prev,false);}
function navForward(){if(navFuture.length===0)return;const next=navFuture.pop();navHistory.push(currentScreenId());showScreen(next,false);}

function updateNavButtons(){}

function renderCategories(){const grid=$('#categoryGrid');grid.innerHTML='';DATA.forEach(cat=>{const selected=state.categoryChosen&&cat.id===state.categoryId;const b=document.createElement('button');b.className='category-btn'+(selected?' selected':'');b.innerHTML=`<span class="emoji">${cat.emoji}</span><span>${cat.name}</span>`;b.onclick=()=>selectCategory(cat.id);grid.appendChild(b)});}
function selectCategory(id){state.categoryId=id;state.categoryChosen=true;state.selectedSubs=new Set();showScreen('subScreen');renderSubs();}
function renderSubs(){if(!state.categoryChosen)return;const grid=$('#subGrid');grid.innerHTML='';const cat=currentCategory();$('#selectedCategoryBadge').textContent=`${cat.emoji} ${cat.name}`;cat.subs.forEach(sub=>{const b=document.createElement('button');b.className='sub-btn'+(state.selectedSubs.has(sub.id)?' selected':'');b.innerHTML=`${sub.emoji} ${sub.name} <small class="sub-count">(${sub.questions.length})</small>`;b.onclick=()=>{hideSubPeek();state.selectedSubs.has(sub.id)?state.selectedSubs.delete(sub.id):state.selectedSubs.add(sub.id);renderSubs()};b.addEventListener('mouseenter',()=>showSubPeek(b,sub));b.addEventListener('mouseleave',scheduleHidePeek);grid.appendChild(b)});const count=cat.subs.filter(s=>state.selectedSubs.has(s.id)).reduce((n,s)=>n+s.questions.length,0);const totalCount=cat.subs.reduce((n,s)=>n+s.questions.length,0);$('#sentenceCount').textContent=`${count}문장 선택됨`;$('#startGameBtn').disabled=count===0;const allSelected=state.selectedSubs.size===cat.subs.length;$('#selectAllBtn').textContent=`${allSelected?'전체 문장 선택 취소':'전체 문장 선택하기'} (${totalCount})`;$('#selectAllBtn').classList.toggle('selected',allSelected);}
function toggleAllSubs(){if(!state.categoryChosen)return;const cat=currentCategory();if(state.selectedSubs.size===cat.subs.length)state.selectedSubs.clear();else state.selectedSubs=new Set(cat.subs.map(s=>s.id));renderSubs();}
function goToCategory(){if(BGM.on)bgmStart();showScreen('categoryScreen');renderCategories();}
function backToCategory(){if(state.categoryChosen){showScreen('subScreen');renderSubs()}else{showScreen('categoryScreen');renderCategories()}}
function goHome(){closeModal();showScreen('coverScreen')}
function confirmHome(){openConfirm('처음으로 갈까요?','진행 중인 게임이 끝납니다.',goHome)}
function confirmBackToCategory(){openConfirm('주제를 바꿀까요?','현재 라운드는 끝나고 점수는 저장됩니다.',backToCategory)}

function startGame(){const cat=currentCategory();let pool=[];cat.subs.filter(s=>state.selectedSubs.has(s.id)).forEach(s=>s.questions.forEach(item=>pool.push({...item,subName:s.name,catName:cat.name})));const maxQuestions=Math.min(pool.length,10);state.questions=shuffle(pool).slice(0,maxQuestions);state.round=0;state.score=0;state.correctCount=0;state.review=[];showScreen('gameScreen');renderQuestion();}
function replaySame(){startGame()}
function renderQuestion(){state.attempts=0;state.hintUsed=false;state.answered=false;const item=currentQuestion();$('#roundChip').textContent=`${state.round+1} / ${state.questions.length}`;$('#scoreChip').textContent=`⭐ ${state.score}점`;$('#progressBar').style.width=`${(state.round/state.questions.length)*100}%`;$('#topicLine').textContent=`${item.catName} · ${item.subName}`;$('#hintBox').classList.remove('show');$('#hintBox').textContent='';$('#answerReveal').classList.remove('show');$('#answerReveal').innerHTML='';$('#feedbackToast').textContent='';$('#hintBtn').disabled=false;$('#submitBtn').disabled=false;let words=item.sentence.split(/\s+/);let mixed=shuffle(words);while(mixed.join(' ')===item.sentence){mixed=shuffle(words);}renderWords(mixed);}
function renderWords(words){const board=$('#wordBoard');board.innerHTML='';words.forEach((word,i)=>{const card=document.createElement('div');card.className=`word-card palette-${i%9}`;card.textContent=word;card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`${word}`);card.addEventListener('pointerdown',startPointerDrag);card.addEventListener('keydown',keyboardMove);board.appendChild(card);});}
function keyboardMove(e){if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const el=e.currentTarget;if(e.key==='ArrowLeft'&&el.previousElementSibling)el.parentElement.insertBefore(el,el.previousElementSibling);if(e.key==='ArrowRight'&&el.nextElementSibling)el.parentElement.insertBefore(el.nextElementSibling,el);el.focus()}
function startPointerDrag(e){if(state.answered||e.button>0)return;e.preventDefault();const el=e.currentTarget;const r=el.getBoundingClientRect();const ghost=el.cloneNode(true);ghost.classList.add('drag-ghost');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.classList.add('dragging');dragState={el,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top};moveGhost(e);document.addEventListener('pointermove',pointerMove,{passive:false});document.addEventListener('pointerup',endPointerDrag,{once:true});document.addEventListener('pointercancel',endPointerDrag,{once:true});}
function moveGhost(e){if(!dragState)return;dragState.ghost.style.left=(e.clientX-dragState.dx)+'px';dragState.ghost.style.top=(e.clientY-dragState.dy)+'px'}
function pointerMove(e){if(!dragState)return;e.preventDefault();moveGhost(e);dragState.ghost.style.display='none';const under=document.elementFromPoint(e.clientX,e.clientY);dragState.ghost.style.display='block';const target=under&&under.closest('.word-card');const board=$('#wordBoard');if(target&&target!==dragState.el){const r=target.getBoundingClientRect();const before=(e.clientY<r.top+r.height/2&&Math.abs(e.clientY-(r.top+r.height/2))>r.height*.2)||e.clientX<r.left+r.width/2;board.insertBefore(dragState.el,before?target:target.nextSibling)}else if(under===board){board.appendChild(dragState.el)}}
function endPointerDrag(){document.removeEventListener('pointermove',pointerMove);if(!dragState)return;dragState.el.classList.remove('dragging');dragState.ghost.remove();dragState=null}
function arrangedSentence(){return $$('#wordBoard .word-card').map(x=>x.textContent).join(' ')}
function normalizeAnswer(s){return s.toLowerCase().replace(/[^a-z0-9가-힣]/g,' ').split(/\s+/).filter(Boolean).join(' ')}
function matchesAnswer(userAnswer, targetSentence){return normalizeAnswer(userAnswer)===normalizeAnswer(targetSentence)}
function reshuffleCurrent(){if(state.answered)return;let words=$$('#wordBoard .word-card').map(x=>x.textContent);let mixed=shuffle(words);const item=currentQuestion();while(mixed.join(' ')===item.sentence){mixed=shuffle(words)}renderWords(mixed)}

function useHint(){if(state.hintUsed||state.answered)return;openConfirm('힌트를 볼까요? 💡',`점수가 3점 줄어듭니다.`,()=>{state.hintUsed=true;$('#hintBtn').disabled=true;$('#hintBox').innerHTML=`<b>뜻:</b> ${currentQuestion().hint}`;$('#hintBox').classList.add('show');closeModal()},'힌트 보기');}
function playSentenceAfterCorrectSound(sentence){const resumeBgm=BGM.on;bgmStop();const sound=$('#correctVoice');sound.volume=1;let started=false;const startSpeech=()=>{if(started)return;started=true;speak(sentence,resumeBgm)};sound.currentTime=0;sound.onended=startSpeech;const playback=sound.play();if(playback)playback.catch(startSpeech);}
function submitAnswer(){if(state.answered)return;const item=currentQuestion();const answer=arrangedSentence();if(matchesAnswer(answer,item.sentence)){state.answered=true;const earned=Math.max(0,10-(state.hintUsed?3:0));state.score+=earned;state.correctCount++;state.review.push({ok:true,sentence:item.sentence,meaning:item.hint});$('#scoreChip').textContent=`⭐ ${state.score}점`;playSentenceAfterCorrectSound(item.sentence);openFeedback('멋지게 문장 퍼즐을 완성했어요. +'+earned+'점',`<div class="correct-answer-card">${item.sentence}</div><p><b>뜻:</b> ${item.hint}</p><p style="font-size:20px;color:#8b50d8"><b>+${earned}점 획득!</b></p>`,true);}else{state.attempts++;state.score-=5;$('#scoreChip').textContent=`⭐ ${state.score}점`;playEffect('wrongVoice');const board=$('#wordBoard');board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');if(state.attempts<3){const remaining=3-state.attempts;$('#feedbackToast').textContent=`아깝다! 순서를 다시 살펴봐요. (-5점, ${remaining}번 남았어요)`;}else{state.answered=true;state.review.push({ok:false,sentence:item.sentence,meaning:item.hint});$('#submitBtn').disabled=true;$('#hintBtn').disabled=true;$('#answerReveal').innerHTML=`정답: <b>${item.sentence}</b><br><b>뜻:</b> ${item.hint}`;$('#answerReveal').classList.add('show');openFeedback('괜찮아요! 다시 배우면 돼요 🌱',`<p>세 번 도전했습니다. 이번에는 이 문장을 기억해 주세요.</p><div class="correct-answer-card">${item.sentence}</div><p><b>뜻:</b> ${item.hint}</p>`,false);}}}

function escapeForAttr(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function nextQuestion(){closeModal();if(state.round<state.questions.length-1){state.round++;renderQuestion()}else finishGame()}
function finishGame(){$('#progressBar').style.width='100%';playEffect('completeVoice');showScreen('resultScreen');const max=state.questions.length*10;const pct=max?state.score/max:0;$('#resultTitle').textContent=pct>=.9?'문장 박사! 🏆':pct>=.65?'정말 잘했어요! 🌟':'끝까지 도전했어요! 🌱';$('#resultScore').textContent=`${state.score}점`;$('#resultCorrect').textContent=`✅ ${state.correctCount}/${state.questions.length}`;$('#resultCategory').textContent=`🏷️ ${currentCategory().name}`;$('#reviewList').innerHTML=state.review.map((r,i)=>`<div class="review-item ${r.ok?'ok':'no'}"><div style="margin-bottom:10px"><b style="font-size:18px">${i+1}. ${r.ok?'✅ 정답!':'🌱 다시 보기'}</b></div><div><span style="font-size:20px;color:#4a3476;font-weight:bold;display:block;margin-bottom:8px">${r.sentence} — ${r.meaning}</span><span style="font-size:16px;color:#6e5a7e;display:block;line-height:1.5">정답으로 잘 맞혔어요!</span></div></div>`).join('');makeConfetti();}
function makeConfetti(){const c=$('#confetti');c.innerHTML='';const colors=['#ff5aa5','#a26af2','#55b9ea','#ffd04a','#6bd1b7'];for(let i=0;i<45;i++){const x=document.createElement('i');x.style.setProperty('--x',Math.random()*100+'%');x.style.setProperty('--d',(2.6+Math.random()*3.5)+'s');x.style.setProperty('--delay',(-Math.random()*5)+'s');x.style.setProperty('--c',colors[i%colors.length]);c.appendChild(x)}}

function openHelp(){if(BGM.on)bgmStart();$('#modalTitle').textContent='How to Play';$('#modalBody').innerHTML=`<section class="how-section"><h3>오늘의 학습 목표</h3><p>단어 카드를 올바른 순서로 배열하여 영어 문장을 완성할 수 있다.</p></section><section class="how-section"><h3>게임 방법</h3><ul class="how-list"><li>주제를 선택해요.</li><li>단어 카드를 드래그해서 올바른 순서로 배열해요.</li><li>게임이 끝나면 학습한 문장과 뜻을 다시 확인해요.</li></ul></section><section class="how-section"><h3>점수 규칙</h3><ul class="how-list"><li>정답일 때 +10점</li><li>오답일 때 -5점</li><li>힌트 사용 시 -3점</li></ul></section>`;$('#modalActions').innerHTML='<button class="primary-btn" onclick="goToCategory();closeModal()">Game Start</button>';modalMode='help';openModal();}
function toggleSfx(){state.sfxOn=!state.sfxOn;updateUtilityButtons();}
function openFeedback(title,body,ok){modalMode='answer';$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalActions').innerHTML=`<button class="primary-btn" onclick="nextQuestion()">${state.round===state.questions.length-1?'결과 보기 🎉':'다음 ➜'}</button>`;const closeBtn=$('.modal-close');closeBtn.style.display='none';openModal();}
function openConfirm(title,body,yesFn,yesText='네'){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<p>${body}</p>`;window.__confirmAction=yesFn;$('#modalActions').innerHTML=`<button class="secondary-btn" onclick="closeModal()">아니요</button><button class="primary-btn" onclick="runConfirm()">${yesText}</button>`;modalMode='confirm';const closeBtn=$('.modal-close');closeBtn.style.display='flex';openModal();}
function runConfirm(){const fn=window.__confirmAction;window.__confirmAction=null;closeModal();if(fn)fn()}
function openModal(){const m=$('#modalBackdrop');const closeBtn=$('.modal-close');closeBtn.style.display=(modalMode==='answer'?'none':'flex');m.classList.add('show');setTimeout(()=>m.querySelector('button')?.focus(),50)}
function closeModal(){modalMode=null;$('.modal-close').style.display='flex';$('#modalBackdrop').classList.remove('show')}
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop'&&modalMode!=='answer')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBackdrop').classList.contains('show')&&modalMode!=='answer')closeModal()});

function playEffect(id){if(!state.sfxOn)return;const a=$('#'+id);try{a.volume=1;a.currentTime=0;a.play()}catch(e){}}
function getEnglishVoice(){const voices=speechSynthesis.getVoices();return voices.find(voice=>/^en-us$/i.test(voice.lang))||voices.find(voice=>/^en/i.test(voice.lang))||null}
if('speechSynthesis'in window)speechSynthesis.addEventListener('voiceschanged',getEnglishVoice);
function speak(text,resumeBgm=false){const resume=()=>{if(resumeBgm&&BGM.on)bgmStart()};if(!state.voiceOn||!('speechSynthesis'in window)){resume();return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const voice=getEnglishVoice();u.lang='en-US';if(voice)u.voice=voice;u.rate=.82;u.pitch=1.08;u.volume=1;u.onend=resume;u.onerror=resume;try{speechSynthesis.speak(u)}catch(e){resume()}}
function toggleVoice(){state.voiceOn=!state.voiceOn;updateUtilityButtons()}
function updateUtilityButtons(){$$('#sfx-toggle-icon,#sfx-toggle-icon-2,#sfx-toggle-icon-3,#sfx-toggle-icon-4,#sfx-toggle-icon-5').forEach(el=>{if(!el)return;el.className=state.sfxOn?'fa-solid fa-bell':'fa-solid fa-bell-slash';});$$('#music-toggle-icon,#music-toggle-icon-2,#music-toggle-icon-3,#music-toggle-icon-4,#music-toggle-icon-5').forEach(el=>{if(!el)return;el.className=BGM.on?'fa-solid fa-music':'fa-solid fa-volume-xmark';});$$('#fullscreen-toggle-icon,#fullscreen-toggle-icon-2,#fullscreen-toggle-icon-3,#fullscreen-toggle-icon-4,#fullscreen-toggle-icon-5').forEach(el=>{if(!el)return;el.className=document.fullscreenElement?'fa-solid fa-compress':'fa-solid fa-expand';});}
async function toggleFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();updateUtilityButtons()}catch(e){}}

let peekTimer=null;
function escHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function showSubPeek(btn,sub){clearTimeout(peekTimer);const el=$('#subPeek');if(!el)return;const list=sub.questions.slice(0,8).map(q=>`<li>${escHtml(q.sentence)}</li>`).join('');const more=sub.questions.length>8?`<div class="peek-more">외 ${sub.questions.length-8}문장</div>`:'';el.innerHTML=`<div class="peek-head">${sub.emoji} ${escHtml(sub.name)}</div><ol class="peek-list">${list}</ol>${more}`;el.style.visibility='hidden';el.classList.add('show');const r=btn.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;let left=r.left+r.width/2-w/2;left=Math.max(10,Math.min(left,window.innerWidth-w-10));let top=r.bottom+8;if(top+h>window.innerHeight-10)top=Math.max(10,r.top-h-8);el.style.left=left+'px';el.style.top=top+'px';el.style.visibility='visible';}
function scheduleHidePeek(){clearTimeout(peekTimer);peekTimer=setTimeout(hideSubPeek,140)}
function hideSubPeek(){clearTimeout(peekTimer);const el=$('#subPeek');if(!el)return;el.classList.remove('show');}
$('#subPeek').addEventListener('mouseenter',()=>clearTimeout(peekTimer));
$('#subPeek').addEventListener('mouseleave',scheduleHidePeek);

function bgmEl(){if(!BGM.el){BGM.el=$('#bgmAudio');BGM.el.volume=0.18;BGM.el.autoplay=true}return BGM.el}
function bgmStart(){const a=bgmEl();if(!a||!BGM.on)return;a.play().catch(()=>{})}
function bgmStop(){const a=bgmEl();if(!a)return;a.pause()}
function toggleBgm(){BGM.on=!BGM.on;if(BGM.on)bgmStart();else bgmStop();updateUtilityButtons();}
document.addEventListener('click',()=>{if(BGM.on)bgmStart()},{once:false});
document.addEventListener('keyup',()=>{if(BGM.on)bgmStart()},{once:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)bgmEl()?.pause();else if(BGM.on)bgmStart()});
window.addEventListener('load',()=>{BGM.on=true;bgmStart();updateUtilityButtons();});
document.addEventListener('DOMContentLoaded',()=>{bgmStart()},{once:true});

renderCategories();updateUtilityButtons();
</script>
</body>
</html>
